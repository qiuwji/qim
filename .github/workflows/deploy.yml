name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build backend
        run: |
          cd backend
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o qim-server ./cmd/server/

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/qim-server,frontend/dist"
          target: "/tmp/qim-deploy"
          strip_components: 1

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cp /tmp/qim-deploy/qim-server /opt/qim/qim/backend/qim-server
            chmod +x /opt/qim/qim/backend/qim-server
            rm -rf /opt/qim/qim/frontend/dist
            cp -r /tmp/qim-deploy/dist /opt/qim/qim/frontend/dist
            rm -rf /tmp/qim-deploy
            sudo systemctl restart qim
            sleep 2
            sudo systemctl status qim --no-pager
