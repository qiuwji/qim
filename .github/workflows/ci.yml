name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Check incremental coverage (≥80%)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push, checking all changed files against empty tree."
            CHANGED=$(git diff --name-only HEAD -- '*.go' | grep -v '_test.go' || true)
          else
            CHANGED=$(git diff --name-only "$BASE" HEAD -- '*.go' | grep -v '_test.go' || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No Go source files changed, skipping coverage check."
            exit 0
          fi

          echo "=== Changed files ==="
          echo "$CHANGED"
          echo ""
          echo "=== Per-file coverage ==="
          FAIL=0

          for FILE in $CHANGED; do
            COV=$(go tool cover -func=coverage.out | grep "/$FILE:" | awk '{
              pct=$NF; sub(/%/,"",pct); sum+=pct; n++
            } END {
              if(n>0) printf "%.1f", sum/n; else print "N/A"
            }')

            if [ "$COV" = "N/A" ]; then
              echo "  $FILE → no coverage data (missing tests)"
              FAIL=1
            else
              ABOVE=$(echo "$COV >= 80" | bc -l)
              if [ "$ABOVE" = "1" ]; then
                echo "  $FILE → ${COV}%  OK"
              else
                echo "  $FILE → ${COV}%  FAIL (need ≥80%)"
                FAIL=1
              fi
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Incremental coverage check FAILED."
            exit 1
          fi

          echo ""
          echo "All changed files meet 80% coverage threshold."

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

  deploy:
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check backend
        run: |
          cd backend
          go mod tidy
          go build ./...

      - name: Check frontend
        run: |
          cd frontend
          npm ci
          npm run check

      - name: Deploy and build on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/qim/qim
            git fetch origin main
            git reset --hard origin/main
            cd backend
            go mod tidy
            go build -o qim-server ./cmd/server/
            cd /opt/qim/qim/frontend
            npm ci
            npm run build
            mkdir -p /var/lib/qim /opt/qim/qim/backend/data/backups
            OLD_DB=/opt/qim/qim/backend/data/qim.db
            NEW_DB=/var/lib/qim/qim.db
            if [ -f "$OLD_DB" ] && [ ! -f "$NEW_DB" ]; then
              TS=$(date +%Y%m%d%H%M%S)
              sqlite3 "$OLD_DB" "PRAGMA wal_checkpoint(FULL);"
              sqlite3 "$OLD_DB" ".backup /opt/qim/qim/backend/data/backups/qim.db.pre-varlib.${TS}.bak"
              sqlite3 "$OLD_DB" ".backup $NEW_DB"
            fi
            if [ ! -f "$NEW_DB" ]; then
              echo "missing sqlite database: $NEW_DB" >&2
              exit 1
            fi
            INTEGRITY=$(sqlite3 "$NEW_DB" "PRAGMA integrity_check;")
            if [ "$INTEGRITY" != "ok" ]; then
              echo "sqlite integrity check failed: $INTEGRITY" >&2
              exit 1
            fi
            if grep -q "^Environment=QIM_DB_PATH=" /etc/systemd/system/qim.service; then
              sed -i "s#^Environment=QIM_DB_PATH=.*#Environment=QIM_DB_PATH=/var/lib/qim/qim.db#" /etc/systemd/system/qim.service
            else
              sed -i "/^Environment=QIM_JWT_SECRET=/a Environment=QIM_DB_PATH=/var/lib/qim/qim.db" /etc/systemd/system/qim.service
            fi
            systemctl daemon-reload
            systemctl restart qim
            sleep 2
            systemctl status qim --no-pager
