name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Check incremental coverage (≥80%)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push, checking all changed files against empty tree."
            CHANGED=$(git diff --name-only HEAD -- '*.go' | grep -v '_test.go' || true)
          else
            CHANGED=$(git diff --name-only "$BASE" HEAD -- '*.go' | grep -v '_test.go' || true)
          fi

          if [ -z "$CHANGED" ]; then
            echo "No Go source files changed, skipping coverage check."
            exit 0
          fi

          echo "=== Changed files ==="
          echo "$CHANGED"
          echo ""
          echo "=== Per-file coverage ==="
          FAIL=0

          for FILE in $CHANGED; do
            COV=$(go tool cover -func=coverage.out | grep -F "$FILE" | awk '{
              pct=$NF; sub(/%/,"",pct); sum+=pct; n++
            } END {
              if(n>0) printf "%.1f", sum/n; else print "N/A"
            }')

            if [ "$COV" = "N/A" ]; then
              echo "  $FILE → no coverage data (missing tests)"
              FAIL=1
            else
              ABOVE=$(echo "$COV >= 80" | bc -l)
              if [ "$ABOVE" = "1" ]; then
                echo "  $FILE → ${COV}%  OK"
              else
                echo "  $FILE → ${COV}%  FAIL (need ≥80%)"
                FAIL=1
              fi
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Incremental coverage check FAILED."
            exit 1
          fi

          echo ""
          echo "All changed files meet 80% coverage threshold."